<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MediScan Pro{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        (function() {
            var t = localStorage.getItem('mediscan_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <div class="nav-logo">
            <svg viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="18" stroke="#00d4aa" stroke-width="2"/>
                <path d="M20 10 L20 30 M10 20 L30 20" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="20" cy="20" r="4" fill="#00d4aa"/>
            </svg>
        </div>
        <span class="nav-title">MediScan <em>Pro</em></span>
    </div>
    <div class="nav-controls">
        <div class="nav-lang">
            <button onclick="setLang('fr')" class="lang-btn active" id="btn-fr">FR</button>
            <button onclick="setLang('ar')" class="lang-btn" id="btn-ar">AR</button>
            <button onclick="setLang('en')" class="lang-btn" id="btn-en">EN</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" title="Changer le thème">
            <span class="theme-icon-dark">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="theme-icon-light">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
                    <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </span>
        </button>
    </div>
</nav>

<div class="page-wrapper">
    {% block content %}{% endblock %}
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
